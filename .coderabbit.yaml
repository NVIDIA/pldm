# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Shared OpenBMC review rules live in dgx/bmc/coderabbit and are pulled in
# via inheritance. Only rules unique to pldm belong in this file.
language: "en-US"
early_access: false
inheritance: true

reviews:
    path_instructions:
        - path: "**/*.{cpp,hpp,c,h}"
          instructions: |
              ## pldm addenda to the inherited OpenBMC rules

              **CG1 – SPDX copyright holder for this repository**
              The copyright line required here is:
              `// SPDX-FileCopyrightText: Copyright OpenBMC Authors`
              Do not flag that holder as incorrect.


chat:
    auto_reply: true
