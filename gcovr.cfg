# gcovr configuration file
# Exclude specific directories from coverage computation

# Exclude test directories
exclude = .*test/.*\.[hc]pp

# Run gcov workers in parallel.
gcov-parallel = yes

# Tolerate the same function appearing at different source lines across TUs.
# common/dBusAsyncUtils.hpp defines coGetDbusProperty / coGetSubTree /
# coGetServiceMap twice under an #ifdef MOCK_DBUS_ASYNC_UTILS switch, so the
# real and mock versions of a given instantiation share a mangled name but
# live at different lines. Without this, gcovr aborts the merge when the
# same template is instantiated in both mocked (test) and unmocked (pldmd)
# translation units.
merge-mode-functions = merge-use-line-min

# Exclude subprojects directory
exclude = .*subprojects.*

# Exclude compiler-generated exception-handling branches (e.g. copy/move
# constructors of std containers) that are not reachable in normal code paths.
exclude-throw-branches = yes

# Exclude branches in lines that are not reachable (compiler dead code).
exclude-unreachable-branches = yes

# Exclude compiler-generated branches attached to function definition lines.
exclude-function-lines = yes

# Exclude non-code lines that still get synthetic branch metadata.
exclude-noncode-lines = yes

print-summary = yes                                 
                                                    
decisions = yes                                     
                                                    
# Upstream files                                    
exclude = (^|.*/)common/transport\.cpp$             
exclude = (^|.*/)common/transport\.hpp$             
exclude = (^|.*/)common/bios_utils\.hpp$            
exclude = (^|.*/)host-bmc/.*
                                                    
# Will be replaced by sdbusplus::async::sleep       
exclude = (^|.*/)common/sleep\.hpp$
